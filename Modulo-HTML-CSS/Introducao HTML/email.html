<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email</title>
</head>
<body>
    <form action="">
        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
        </div>
        <br>
        <div>
            <fieldset>
                <legend>Assunto:</legend>
                <label>
                    <input type="radio" name="assunto" id="compra"> Compra
                </label>
                <label>
                    <input type="radio" name="assunto" id="cotacao"> Cotação
                </label>
            </fieldset>
        </div>

    </form>
    
</body>
</html>
