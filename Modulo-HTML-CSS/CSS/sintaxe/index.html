<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintaxe CSS</title>
    <style>
        .titulo{
            color:rgb(124, 190, 192);
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 55px;
            border: 6px solid rgb(202, 202, 202);

        }
        .paragrafo{
            color:rgb(200, 205, 209);
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 35px;
        }
    </style>
</head>
<body>
    <h1 class="titulo">Título de Exemplo 1</h1>
    <p class="paragrafo">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias magnam accusamus saepe eius velit non neque error fugiat aut. Commodi incidunt ullam, omnis eos ipsa a cum aliquid maxime quia.</p>
</body>
</html>
